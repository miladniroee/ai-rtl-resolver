<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    @font-face {
      font-family: 'Vazirmatn';
      src: url('fonts/Vazirmatn-Regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Vazirmatn', system-ui, sans-serif;
      background: #0f0f18;
      color: #ede9ff;
      width: 350px;
      padding: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .logo {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .title { font-size: 13px; font-weight: 700; }
    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: #b0acff;
      margin-top: 12px;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .sites {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
    }
    .site-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      background: #18182a;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 6px;
    }
    .site-item:hover { border-color: rgba(255,255,255,0.15); }
    .site-icon {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      object-fit: contain;
      flex-shrink: 0;
    }
    .site-name {
      flex: 1;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .toggle {
      position: relative;
      width: 28px;
      height: 16px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      background: #54506e;
      border-radius: 16px;
      transition: 0.2s;
    }
    .slider::before {
      content: '';
      position: absolute;
      width: 12px;
      height: 12px;
      left: 2px;
      bottom: 2px;
      background: #fff;
      border-radius: 50%;
      transition: 0.2s;
    }
    .toggle input:checked + .slider { background: #52d68a; }
    .toggle input:checked + .slider::before { transform: translateX(12px); }

    .font-controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      background: #18182a;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 6px;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .control-label {
      font-size: 10px;
      font-weight: 600;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .control-input {
      padding: 6px 8px;
      background: #0f0f18;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 4px;
      color: #ede9ff;
      font-size: 12px;
      font-family: inherit;
    }
    .control-input:focus {
      outline: none;
      border-color: rgba(255,255,255,0.15);
      background: #141420;
    }

    #links, #links a { font-size: 10px; color: #666; text-decoration: none; }
    #links a:hover { color: #999; }
    .footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px;}
    .footer>span { font-size: 10px; color: #666}
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <img src="https://raw.githubusercontent.com/miladniroee/ai-rtl-resolver/refs/heads/main/public/icons/icon-32.png" width="24" alt="Ai RTL Resolver">
    </div>
    <div class="title">AI RTL Resolver</div>
  </div>
  
  <div class="section-title">Sites</div>
  <div id="sites" class="sites"></div>
  
  <div class="section-title">Font Settings</div>
  <div class="font-controls">
    <div class="control-group">
      <label class="control-label">Font Family</label>
      <select id="fontFamily" class="control-input">
        <option value="Vazirmatn">Vazirmatn</option>
        <option value="Lalezar">Lalezar</option>
        <option value="Parastoo">Parastoo</option>
      </select>
    </div>
    <div class="control-group">
      <label class="control-label">Font Size (8-72px)</label>
      <input type="number" id="fontSize" class="control-input" min="8" max="72" value="16">
    </div>
  </div>
  
  <div class="footer">
    <div id="links">
      <a href="https://miladniroee.github.io/ai-rtl-resolver" target="_blank">Homepage</a>
      <span>&nbsp;&#9679;&nbsp;</span>
      <a href="https://github.com/miladniroee/ai-rtl-resolver" target="_blank">Github</a>
    </div>
    <span>By Milad Niroee</span>
  </div>
  <script src="popup.js"></script>
</body>
</html>
